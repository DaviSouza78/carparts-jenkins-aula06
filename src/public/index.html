<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carparts B2B · demonstração</title><style>body{font:16px system-ui;margin:0;background:#f3f6fa;color:#152235}main{max-width:760px;margin:4rem auto;background:white;padding:2rem;border-radius:18px;box-shadow:0 12px 30px #15223515}h1{margin-top:0}label{display:block;margin-top:1rem}input{display:block;width:100%;padding:.7rem;box-sizing:border-box}button{margin-top:1rem;padding:.8rem 1rem;background:#0769aa;color:white;border:0;border-radius:7px}pre{white-space:pre-wrap;background:#eef3f8;padding:1rem;border-radius:7px}</style><main><h1>Carparts · pedidos B2B</h1><p>Protótipo de API e front-end para demonstrar a esteira Jenkins. Não armazena pedidos fora da memória do processo.</p><form id="f"><label>Peça<input name="part" required></label><label>Quantidade<input name="quantity" type="number" min="1" required></label><button>Criar pedido de demonstração</button></form><h2>Resposta</h2><pre id="out">Aguardando pedido.</pre></main><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({part:f.get('part'),quantity:Number(f.get('quantity'))})});document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2)})</script></html>
