# Exemplo para um proxy HTTPS dedicado. Substitua domínio e certificados.
# A interface Jenkins continua atrás de VPN; apenas o webhook recebe tráfego público.
server {
    listen 443 ssl;
    server_name jenkins-webhook.example.org;
    ssl_certificate /etc/letsencrypt/live/jenkins-webhook.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins-webhook.example.org/privkey.pem;

    location = /github-webhook/ {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://jenkins-interno:8080/github-webhook/;
    }

    location / { return 403; }
}
